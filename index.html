<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 브라우저 탭과 검색 결과에 표시되는 제목 -->
    <title>모닝브루 카페</title>
    <!-- 외부 CSS 파일 연결 -->
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body id="top">
    <!-- 상단 메뉴 -->
    <header class="site-header">
      <a
        class="logo"
        href="#top"
        aria-label="Morning Brew 홈페이지 맨 위로 이동"
      >
        Morning Brew
      </a>

      <!-- 모바일에서 메뉴를 열고 닫는 버튼 -->
      <button class="menu-button" id="menuButton" type="button">☰</button>

      <!-- JavaScript가 찾을 수 있도록 id를 추가한다. -->
      <nav class="navigation" id="navigation">
        <a href="#home">홈</a>
        <a href="#menu">메뉴</a>
        <a href="#contact">문의하기</a>
      </nav>
    </header>

    <main>
      <!-- 대표 소개 영역 -->
      <section class="hero" id="home">
        <div class="hero-content">
          <h1>매일 아침, 좋은 커피</h1>

          <p>직접 고른 원두와 따뜻한 공간으로 하루의 여유를 만들어드립니다.</p>
        </div>
      </section>

      <!-- 메뉴 영역 -->
      <section class="menu-section" id="menu">
        <h2>대표 메뉴</h2>

        <!-- 메뉴 종류를 선택하는 필터 버튼 -->
        <div class="filter-buttons">
          <button class="filter-button active" data-category="all">전체</button>
          <button class="filter-button" data-category="coffee">커피</button>
          <button class="filter-button" data-category="nonCoffee">
            논커피
          </button>
        </div>

        <div class="menu-list" id="menuList"></div>
      </section>

      <!-- 고객 문의 영역 -->
      <section class="contact-section" id="contact">
        <h2>문의하기</h2>
        <p>단체 주문이나 예약 문의를 남겨주세요.</p>

        <!-- 사용자가 내용을 입력하는 양식 -->
        <form class="contact-form" id="contactForm">
          <!-- for와 id가 같으면 글자를 눌러도 입력창이 선택된다. -->
          <label for="nameInput">이름</label>
          <input id="nameInput" type="text" placeholder="이름을 입력하세요" />

          <label for="inquiryInput">문의 내용</label>
          <textarea
            id="inquiryInput"
            rows="5"
            placeholder="문의 내용을 입력하세요"
          ></textarea>

          <!-- form 내부의 submit 버튼은 양식을 제출한다. -->
          <button type="submit">문의 보내기</button>

          <!-- JavaScript가 결과 문구를 표시할 빈 공간 -->
          <p class="form-message" id="formMessage"></p>
        </form>
      </section>
    </main>

    <!-- 홈페이지의 가장 아래 -->
    <footer class="site-footer">
      <p>© 2026 Morning Brew. All rights reserved.</p>
    </footer>
    <!-- 외부 JavaScript 파일 연결 -->
    <script src="./script.js"></script>
  </body>
</html>
